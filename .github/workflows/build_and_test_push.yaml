name: "Test, build, sync to AWS, and create release (on tagged push)"
on: push


jobs:

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Setup Script
        run: |
          bash ./.github/scripts/before_install.sh
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
          ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}

      - name: Run Tests
        run: go test -v github.com/uc-cdis/gen3-client/tests

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: linux
            zipfile: dataclient_linux.zip
          - goos: darwin
            goarch: amd64
            artifact: darwin-amd64
            zipfile: dataclient_osx.zip
          - goos: darwin
            goarch: arm64
            artifact: darwin-arm64
            zipfile: dataclient_osx_arm64.zip
          - goos: windows
            goarch: amd64
            artifact: windows
            zipfile: dataclient_win64.zip
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Setup Script
        run: |
          bash .github/scripts/before_install.sh
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
          ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}


      - name: Run Build Script
        run: |
          bash .github/scripts/build.sh
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.artifact }}
          path: ~/shared/${{ matrix.zipfile }}
          retention-days: 3


  sign:
    needs: build
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            host_architecture: x86_64
            zipfile: dataclient_osx.zip
            pkgfile: dataclient_osx.pkg
          - goarch: arm64
            host_architecture: arm64
            zipfile: dataclient_osx_arm64.zip
            pkgfile: dataclient_osx_arm64.pkg
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-darwin-${{ matrix.goarch }}
          path: ./dist
      - name: Unzip and verify macOS binary
        run: |
          unzip -q ./dist/${{ matrix.zipfile }} -d ./dist
          rm ./dist/${{ matrix.zipfile }}
          lipo -verify_arch ${{ matrix.host_architecture }} ./dist/gen3-client



      - name: Build executable
        shell: bash
        env:
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_UUID: ${{ secrets.APPLE_NOTARY_UUID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY}}
          APPLE_NOTARY_DATA: ${{ secrets.APPLE_NOTARY_DATA }}
          APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
          APPLICATION_CERT_PASSWORD: ${{ secrets.APPLICATION_CERT_PASSWORD }}
          APPLICATION_CERT_DATA: ${{ secrets.APPLICATION_CERT_DATA }}
          APPLE_TEAM_ID: WYQ7U7YUC9

        run: |
          # Setup
          SIGNFILE="$(pwd)/dist/gen3-client"

          # Export certs
          echo "$APPLE_CERT_DATA" | base64 --decode > /tmp/certs.p12
          echo "$APPLE_NOTARY_DATA" | base64 --decode > /tmp/notary.p8
          echo "$APPLICATION_CERT_DATA" | base64 --decode > /tmp/app_certs.p12

          # Create keychain
          security create-keychain -p actions macos-build.keychain
          security default-keychain -s macos-build.keychain
          security unlock-keychain -p actions macos-build.keychain
          security set-keychain-settings -t 3600 -u macos-build.keychain

          # Import certs to keychain
          security import /tmp/certs.p12 -k ~/Library/Keychains/macos-build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security import /tmp/app_certs.p12 -k ~/Library/Keychains/macos-build.keychain -P "$APPLICATION_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign

          # Key signing
          security set-key-partition-list -S apple-tool:,apple: -s -k actions macos-build.keychain

          # Verify keychain things
          security find-identity -v macos-build.keychain | grep "$APPLE_TEAM_ID" | grep "Developer ID Application"
          security find-identity -v macos-build.keychain | grep "$APPLE_TEAM_ID" | grep "Developer ID Installer"

          # Force the codesignature
          codesign --force --options=runtime --keychain "/Users/runner/Library/Keychains/macos-build.keychain-db" -s "$APPLE_TEAM_ID" "$SIGNFILE"

          # Verify the code signature
          codesign -v "$SIGNFILE" --verbose

          mkdir -p ./dist/pkg
          cp ./dist/gen3-client ./dist/pkg/gen3-client
          pkgbuild --identifier "org.uc-cdis.gen3-client" --timestamp --install-location /Applications --root ./dist/pkg installer.pkg
          sed 's/hostArchitectures="x86_64,arm64"/hostArchitectures="${{ matrix.host_architecture }}"/' ./distribution.xml > ./dist/distribution.xml
          productbuild --resources ./resources --distribution ./dist/distribution.xml --package-path . gen3-client.pkg
          productsign --sign "$APPLE_TEAM_ID" --timestamp gen3-client.pkg gen3-client_signed.pkg

          xcrun notarytool store-credentials "notarytool-profile" --issuer $APPLE_NOTARY_UUID --key-id $APPLE_NOTARY_KEY --key /tmp/notary.p8
          xcrun notarytool submit gen3-client_signed.pkg --keychain-profile "notarytool-profile" --wait
          xcrun stapler staple gen3-client_signed.pkg
          mv gen3-client_signed.pkg ${{ matrix.pkgfile }}

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-darwin-${{ matrix.goarch }}-signed
          path: ${{ matrix.pkgfile }}

  sync_signed_to_aws:
    runs-on: ubuntu-latest
    needs: sign

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Run Setup Script
        run: |
          bash ./.github/scripts/before_install.sh
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
          ACCESS_KEY: ${{ secrets.AWS_S3_ACCESS_KEY_ID }}
          SECRET_ACCESS_KEY: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}

      - name: Download Intel macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-darwin-amd64-signed

      - name: Download Apple Silicon macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-darwin-arm64-signed

      - name: Sync to AWS
        env:
          GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          rm -f ~/shared/dataclient_osx.zip ~/shared/dataclient_osx_arm64.zip
          zip dataclient_osx_signed.zip dataclient_osx.pkg
          zip dataclient_osx_arm64_signed.zip dataclient_osx_arm64.pkg
          mv dataclient_osx_signed.zip dataclient_osx_arm64_signed.zip ~/shared/
          aws s3 sync ~/shared s3://cdis-dc-builds/$GITHUB_BRANCH


  get_tagged_branch:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build,sign]
    outputs:
      on_master: ${{ steps.check_step.outputs.on_master }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether tag is on master
        id: check_step
        run: |
          if git merge-base --is-ancestor HEAD origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_master=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: get_tagged_branch
    if: startsWith(github.ref, 'refs/tags/') && needs.get_tagged_branch.outputs.on_master == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-linux

      - name: Download Intel macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-darwin-amd64-signed

      - name: Download Apple Silicon macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-darwin-arm64-signed

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-windows

      - name: Create Release gh cli
        env:
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GH_TAG: ${{ github.ref_name }}
        run: gh release create "$GH_TAG" dataclient_linux.zip dataclient_osx.pkg dataclient_osx_arm64.pkg dataclient_win64.zip --repo="$GITHUB_REPOSITORY"
